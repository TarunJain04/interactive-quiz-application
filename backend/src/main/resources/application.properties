spring.application.name=quiz
spring.config.import=optional:file:.env[.properties]
server.port=9092
spring.data.mongodb.uri=mongodb://localhost:27017/quiz

spring.data.mongodb.auto-index-creation=true

game.maximum-duration=PT30M
game.abandonment-scan-interval-ms=300000

quiz-api.api-key=${QUIZ_API_APIKEY}
quiz-api.base-url=https://quizapi.io/api/v1

spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD}
spring.security.user.roles=ADMIN
